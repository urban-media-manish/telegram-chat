<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meta Ads Link Generator — TeleTrack</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f1d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-logo">
        <span class="logo-icon">⚡</span>
      </div>
      <div>
        <h1 class="brand-title">TeleTrack CAPI</h1>
        <p class="brand-subtitle">WhatsApp-Style Bot Chat & Meta Sync</p>
      </div>
    </div>

    <!-- Page Nav Links -->
    <nav class="main-nav-links">
      <a href="/chat" class="nav-link-btn">💬 Live Chat</a>
      <a href="/leads" class="nav-link-btn">📋 Leads History</a>
      <a href="/channels" class="nav-link-btn">👤 Accounts & Channels</a>
      <a href="/links" class="nav-link-btn active">🎯 Meta Ad Links</a>
    </nav>

    <div class="nav-actions">
      <div class="live-indicator">
        <span class="pulse-dot"></span> Live Sync Active
      </div>
      <button class="btn btn-outline btn-sm" id="btnToggleNotification">
        🔔 Enable Notifications
      </button>
      <button class="btn btn-outline btn-pwa btn-sm" id="btnInstallApp">
        📲 Add to Home Screen
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="dashboard-container">
    
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Meta Ads Destination URLs</h2>
        <p class="card-desc">Copy these ready-to-use links and paste into your Facebook & Instagram Ads Manager (Website URL / Destination field).</p>
      </div>

      <div class="links-generator-list" id="adLinksList">
        <!-- Populated by JS -->
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
